# 闲鱼卖家工作台 —— NAS 部署配置
#
# 适用于飞牛 fnOS、群晖、威联通、软路由等设备。
#
# 使用本项目 Dockerfile-cn 从源码构建，不拉取上游预构建镜像。
# 构建需要额外 CPU、内存和磁盘空间；低配设备可在其他机器构建后分发镜像。
#
# 使用前请在 .env 或容器环境中设置非空的强 ADMIN_PASSWORD。
#
# 启动：docker compose -f docker-compose.nas.yml up -d

services:
  xianyu-app:
    build:
      context: .
      dockerfile: Dockerfile-cn
    image: xianyu-seller-console:latest
    container_name: xianyu-seller-console
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./backups:/app/backups:rw
    environment:
      TZ: Asia/Shanghai
      DB_PATH: /app/data/xianyu_data.db
      LOG_LEVEL: INFO

      # 替换为你自己的强密码。
      # 只在首次创建数据库时生效；数据库已存在时改这里不会改密码。
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env or the container environment}"

      AUTO_REPLY_ENABLED: "true"
      AUTO_DELIVERY_ENABLED: "true"
      AI_REPLY_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 512M
